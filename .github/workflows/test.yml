name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    name: Lua tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: nix develop -c just test
